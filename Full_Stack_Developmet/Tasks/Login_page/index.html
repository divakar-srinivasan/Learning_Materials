<!DOCTYPE html>
<html>
    <head>
        <title>Login_page</title>
        <link rel="stylesheet" href="./styles.css">
    </head>
    <body>
        <div class="page">
            <div class="login-card">
                <h1>Welcome back</h1>
                <p>Sign in to Continue your learning progress</p>
                <form>
                    <label class="label" for="email">Email</label>
                    <input class="input-field" type="email" id="email" placeholder="Enter your email" required>
                    <label class="label" for="password">Password</label>
                    <input class="input-field" type="password" id="password" placeholder="Enter your password" required>

                    <div class="options">
                        <label class="remember">
                            <input type="checkbox">Remember me
                        </label>
                        <a class="link" href="#">Forget Password</a>
                    </div>

                    <button class="signin" type="submit">
                        Sign In
                    </button>

                </form>
            </div>
        </div>
    </body>
</html>

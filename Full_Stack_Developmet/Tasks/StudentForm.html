<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Form</title>
</head>

<body>
    <h1>Student Registration Form</h1>
    <form>
        <div>
        <label for="name">Name : </label>
        <input id="name" type="text" name="username" value="" placeholder="Enter you name" required>
    </div>
    <br>
    <div>
        <label for="email">Email : </label>
        <input id="email" type="email" name="email" value="" placeholder="Enter your email address" required>
    </div>
    <br>
    <div>
        <label for="password">Password : </label>
        <input id="password" type="password" name="password" value="" placeholder="Enter your password" required="">
    </div>
    <br>
    <div>
        <label for="age">Age : </label>
        <input id="age" type="number" name="age" min="1" max="100" required>
    </div>
    <br>
    <div>
        <label for="dob">DOB : </label>
        <input id="dob" type="date" name="dob" required>
    </div>
    <br>
    <div>
        <label for="phone">Phone : </label>
        <input id="phone" type="tel" name="phone" placeholder="Enter your phone number" required>
    </div>
    <br>
    <div>
        <p>Gender</p>
        <input id="male" type="radio" name="gender" value="male"><label for="male">M</label>
        <input id="female" type="radio" name="gender" value="female"><label for="female">F</label>
    </div>
    <br>
    <div>
        <p>Skills</p>
        <input type="checkbox" id="java" name="skills" value="java"> <label for="java">Java</label>
        <input type="checkbox" id="html" name="skills" value="html"> <label for="html">HTML</label>
        <input type="checkbox" id="css" name="skills" value="css"> <label for="css">CSS</label>
    </div>
    <br>
    <div>
        <lable for="brach">Branch : </lable>
        <select id="branch" name="branch" required>
            <option value="it">IT</option>
            <option value="cse">CSE</option>
            <option value="aids">AIDS</option>
            <option value="mech">MECH</option>
        </select>
    </div>
    <br>
    <div>
        <label for="file">photo upload : </label>
        <input id="file" type="file">
    </div>
    <br>
    <input type="submit">
    <input type="reset">
    </form>
</body>

</html>
